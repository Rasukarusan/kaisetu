* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14.5px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
ins, del { text-decoration: none; }
button { font-family: inherit; }

/* ---------- topbar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 16px;
  padding: 12px 24px;
  background: var(--topbar-bg);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}
.logo {
  font-family: var(--mono); font-size: 12px; letter-spacing: .35em;
  color: var(--ink-soft); white-space: nowrap;
}
.topbar h1 {
  font-size: 15.5px; font-weight: 700; margin: 0;
  flex: 0 1 auto; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.stats-chip {
  font-family: var(--mono); font-size: 12px; white-space: nowrap;
  background: var(--gray-bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 3px 10px; color: var(--ink-soft);
}
.stats-chip ins { color: var(--green); font-weight: 600; }
.stats-chip del { color: var(--red); font-weight: 600; }
.topbar .spacer { flex: 1; }
.comment-count {
  font-family: var(--mono); font-size: 12px; color: var(--ink-soft); white-space: nowrap;
  background: none; border: 1px solid transparent; border-radius: 7px; padding: 5px 9px; cursor: pointer;
}
.comment-count:hover, .comment-count.active {
  border-color: var(--border); background: var(--gray-bg); color: var(--ink);
}
.topbar .opt {
  display: flex; align-items: center; gap: 5px;
  font-family: var(--mono); font-size: 12px; color: var(--ink-soft);
  cursor: pointer; user-select: none; white-space: nowrap;
}
.topbar .opt input { accent-color: var(--blue); cursor: pointer; }
body.hide-tests :is(.hunk.is-test, .section-head.is-test, .ft-file.is-test,
  .group.is-test, .index-card.is-test) { display: none; }

/* ---------- comment drawer (right sidebar) ---------- */
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: 360px; max-width: 85vw; z-index: 80;
  background: var(--card); border-left: 1px solid var(--border);
  box-shadow: -10px 0 30px rgba(20,24,33,.12);
  transform: translateX(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
  display: flex; flex-direction: column;
}
.drawer.open { transform: translateX(0); }
.drawer-head {
  display: flex; align-items: center; gap: 8px;
  padding: 13px 16px; border-bottom: 1px solid var(--border);
}
.drawer-head .ttl { font-size: 14px; font-weight: 700; flex: 1; }
.drawer-close {
  width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--border);
  background: var(--card); color: var(--ink-soft); cursor: pointer; font-size: 13px;
}
.drawer-close:hover { border-color: var(--border-strong); color: var(--ink); }
.drawer-list { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.drawer-item {
  border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px;
  cursor: pointer; transition: all .12s;
}
.drawer-item:hover { border-color: var(--border-strong); background: var(--gray-bg); }
.drawer-item.resolved { opacity: .55; }
.drawer-item.resolved .where { color: var(--green); }
.drawer-item .where {
  display: flex; gap: 8px; align-items: center;
  font-family: var(--mono); font-size: 11px; color: var(--ink-faint);
  margin-bottom: 4px;
}
.drawer-item .where .w { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drawer-item .body { font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
.drawer-empty { color: var(--ink-faint); font-size: 13px; text-align: center; margin-top: 40px; }

/* ---------- file tree (left sidebar) ---------- */
.filetree {
  position: fixed; top: 53px; left: 0; bottom: 0; width: 250px; z-index: 40;
  overflow-y: auto; padding: 18px 12px 30px;
  border-right: 1px solid var(--border);
  font-size: 12.5px;
}
.filetree .ft-label {
  font-family: var(--mono); font-size: 11px; letter-spacing: .22em;
  color: var(--ink-faint); margin: 0 0 10px 6px;
}
.ftree ul { list-style: none; margin: 0; padding: 0; }
.ftree ul ul { padding-left: 14px; }
.ft-dir > .ft-name, .ft-file {
  display: flex; align-items: center; gap: 5px;
  padding: 2.5px 6px; border-radius: 6px; cursor: pointer; user-select: none;
  color: var(--ink-soft); white-space: nowrap;
}
.ft-dir > .ft-name:hover, .ft-file:hover { background: var(--gray-bg); color: var(--ink); }
.ft-dir > .ft-name { overflow: hidden; text-overflow: ellipsis; }
.ft-dir > .ft-name .caret { font-size: 9px; color: var(--ink-faint); transition: transform .12s; }
.ft-dir.closed > .ft-name .caret { transform: rotate(-90deg); }
.ft-dir.closed > ul { display: none; }
.ft-file .n { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.ft-file .cnt { font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); }
.help-btn {
  width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--border);
  background: var(--card); color: var(--ink-soft); cursor: pointer;
  font-family: var(--mono); font-size: 13px;
}
.help-btn:hover { border-color: var(--border-strong); color: var(--ink); }

/* ---------- layout ---------- */
main { max-width: 1060px; margin: 0 auto; padding: 28px 24px 64px; }
@media (min-width: 1340px) {
  main { margin-left: max(274px, calc((100vw - 1060px) / 2)); margin-right: auto; }
}
@media (max-width: 1339.98px) { .filetree { display: none; } }
.sec-label {
  font-family: var(--mono); font-size: 12px; letter-spacing: .22em;
  color: var(--ink-faint); margin: 34px 0 14px;
}
.meta-line {
  font-family: var(--mono); font-size: 12px; color: var(--ink-faint);
  margin: -6px 0 16px;
}
.meta-line b { color: var(--ink-soft); font-weight: 600; }
.meta-line a { color: var(--blue); text-decoration: none; }
.meta-line a:hover { text-decoration: underline; }
.overview {
  font-size: 14.5px; line-height: 1.9; color: var(--ink);
  margin: 0 0 6px; max-width: 880px;
}
.overview .tagline {
  font-size: 19px; font-weight: 700; line-height: 1.5;
  margin: 0 0 10px;
}
.overview ul { margin: 0; padding-left: 1.4em; }
.overview li { margin: 2px 0; }
.overview p { margin: 0 0 6px; }
/* Right side of "technical change ＝ what happens as a result" (the plain-language outcome) */
.overview .eq { color: var(--ink-faint); margin: 0 .4em; }
.overview .eff { color: var(--ink-soft); }
.overview .tagline .eff {
  display: block; margin-top: 5px;
  font-size: 14.5px; font-weight: 500; line-height: 1.7;
}

/* ---------- group index ---------- */
.group-index { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.index-card {
  display: flex; align-items: center; gap: 14px;
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  border-left: 4px solid var(--gray);
  padding: 12px 16px; cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform .12s ease, border-color .12s ease;
  animation: rise .4s ease backwards;
}
.index-card:hover { transform: translateY(-1px); border-color: var(--border-strong); }
.index-card.risk-high { border-left-color: var(--risk-high); }
.index-card.risk-medium { border-left-color: var(--risk-medium); }
.index-card.risk-low { border-left-color: var(--risk-low); }
.index-card .txt { flex: 1; min-width: 0; }
.index-card .t { font-weight: 700; font-size: 14.5px; }
.index-card .s {
  color: var(--ink-soft); font-size: 13px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.index-card .badges { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }

/* ---------- badges / chips ---------- */
.chip {
  display: inline-block; font-size: 12px; line-height: 1;
  padding: 4px 8px; border-radius: 6px; font-weight: 600;
}
.chip.mono { font-family: var(--mono); font-weight: 500; }
.chip.tag { background: var(--card); border: 1px solid var(--border); color: var(--ink-soft); font-family: var(--mono); font-weight: 500; }
.chip.hunks { color: var(--ink-soft); font-family: var(--mono); font-weight: 500; padding: 4px 2px; }
.chip.question { color: var(--amber); font-weight: 700; padding: 4px 2px; }
.risk-badge { font-size: 12px; padding: 4px 9px; border-radius: 6px; font-weight: 700; white-space: nowrap; }
.risk-badge .dots { font-size: 8.5px; letter-spacing: 1px; vertical-align: 1px; margin-right: 4px; }
.risk-badge.high { background: var(--risk-high); color: var(--risk-high-ink); }
.risk-badge.medium { background: var(--risk-medium-bg); color: var(--risk-medium-ink); }
.risk-badge.low { background: var(--gray-bg); color: var(--ink-faint); }
